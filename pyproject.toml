[project]
name = "harness-model-context-getting-started"
version = "0.1.0"
description = "Harness, model, context: the three parts of an agent, built from scratch, with Harbor-style evals, context-window traces and a data flywheel."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gopal Saini" }]
dependencies = [
    "anthropic>=2.8", # only imported when you pick a Claude model; every lesson runs without calling it
]

[project.scripts]
agentlab = "agentlab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlab"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # the formatter wraps code; long strings stay readable

[tool.pytest.ini_options]
testpaths = ["tests"]
